name: CI devops 2026
on:
  #to begin you want to launch this job in main 
  push:
    branches: 
      - main
      - develop 
  pull_request:

jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
     #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

     #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

    # Build, tests et analyse de qualité du code par SonarCloud
      - name: Build, test and analyze with Maven + SonarCloud
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Will-emma_tp-devops-docker -Dsonar.organization=will-emma -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file simple-api/pom.xml


