name: CD devops 2026
on:
  # Se déclenche quand le workflow de CI (main.yml) est terminé
  workflow_run:
    workflows: ["CI devops 2026"]  
    types: [completed]
    branches: [main]                

jobs:
  build-and-push-docker-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Récupère exactement le commit qui a été testé par la CI
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest
          push: ${{ github.ref == 'refs/heads/main' }}

  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Image Docker qui fournit Ansible
      - name: Build Ansible image
        run: docker build -t ansible-runner ./ansible

      # Clé SSH et mot de passe du vault, depuis les secrets GitHub
      - name: Set up SSH key and vault password
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass
          chmod 600 ~/.vault_pass

      # Ansible tourne dans le conteneur et déchiffre le vault
      - name: Deploy with Ansible in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/ansible:/ansible \
            -v $HOME/.ssh/id_rsa:/root/.ssh/id_rsa:ro \
            -v $HOME/.vault_pass:/vault_pass:ro \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            ansible-runner -i inventories/setup.yml playbook.yml --vault-password-file /vault_pass
