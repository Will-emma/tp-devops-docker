---
- name: Run simple-api
  community.docker.docker_container:
    name: simple-api
    image: willemma/tp-devops-simple-api
    pull: true
    restart_policy: unless-stopped
    env:
      DATABASE_HOST: database
      DATABASE_PASSWORD: "{{ postgres_password }}"
    networks:
      - name: front-network
      - name: back-network
